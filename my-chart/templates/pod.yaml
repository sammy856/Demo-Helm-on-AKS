apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.name }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Values.appName }}

  template:
    metadata:
      labels:
        app: {{ .Values.appName }}

    spec:
      containers:
        - name: {{ .Values.appName }}

          image: {{ .Values.imageLink }}

          imagePullPolicy: Always

          ports:
            - containerPort: {{ .Values.port }}